<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#03045A"/>
      <stop offset="50%" style="stop-color:#023E8A"/>
      <stop offset="100%" style="stop-color:#0353A4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(3,5,90,0.4)"/>
    </filter>
  </defs>
  
  <!-- خلفية مستديرة -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>
  
  <!-- طبقة لمعة -->
  <rect width="1024" height="512" rx="230" fill="url(#shine)" opacity="0.5"/>
  
  <!-- دائرة خلفية للأيقونة -->
  <circle cx="512" cy="440" r="220" fill="rgba(255,255,255,0.1)"/>
  
  <!-- أيقونة مكنسة (broom) مبسّطة -->
  <!-- العصا -->
  <rect x="560" y="180" width="44" height="340" rx="22" fill="white" opacity="0.95"
        transform="rotate(35, 582, 350)"/>
  
  <!-- رأس المكنسة -->
  <path d="M360 480 Q290 560 320 640 L480 640 Q540 560 480 480 Z" 
        fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- خطوط المكنسة -->
  <line x1="360" y1="480" x2="340" y2="640" stroke="rgba(3,5,90,0.3)" stroke-width="8"/>
  <line x1="400" y1="470" x2="390" y2="640" stroke="rgba(3,5,90,0.3)" stroke-width="8"/>
  <line x1="440" y1="468" x2="440" y2="640" stroke="rgba(3,5,90,0.3)" stroke-width="8"/>
  <line x1="480" y1="470" x2="490" y2="640" stroke="rgba(3,5,90,0.3)" stroke-width="8"/>
  
  <!-- نجمة بريق صغيرة -->
  <circle cx="700" cy="250" r="12" fill="rgba(255,255,255,0.6)"/>
  <circle cx="680" cy="300" r="6" fill="rgba(255,255,255,0.4)"/>
  <circle cx="730" cy="280" r="8" fill="rgba(255,255,255,0.5)"/>
  
  <!-- نص شغّالتي -->
  <text x="512" y="790" 
        font-family="Arial, sans-serif" 
        font-size="90" 
        font-weight="900" 
        fill="white" 
        text-anchor="middle"
        opacity="0.95">شغّالتي</text>
  
  <!-- نقطة تزيينية -->
  <circle cx="512" cy="850" r="6" fill="rgba(255,255,255,0.5)"/>
</svg>
